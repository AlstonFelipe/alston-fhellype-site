<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174A73" />
    <title>Mensagem enviada | Alston Fhellype</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; background: #f5f0e8; color: #172330; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(620px, 100%); background: #fffdf9; border: 1px solid #ded5c9; padding: clamp(32px, 7vw, 72px); box-shadow: 0 24px 70px rgba(23, 35, 48, .12); }
      .eyebrow { font: 700 11px/1.4 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #b36f58; }
      h1 { font-size: clamp(38px, 7vw, 68px); line-height: .98; font-weight: 400; margin: 18px 0 24px; }
      p { font: 16px/1.7 Arial, sans-serif; color: #52606b; max-width: 46ch; }
      a { display: inline-block; margin-top: 20px; background: #174a73; color: #fff; text-decoration: none; padding: 14px 20px; font: 700 12px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Contato recebido</div>
      <h1>Obrigado pela sua mensagem.</h1>
      <p>Sua mensagem foi enviada com sucesso. Alston Fhellype poderá respondê-la pelo endereço de e-mail informado.</p>
      <a href="/">Voltar ao site</a>
    </main>
  </body>
</html>
